<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Svampletarna - Logga in</title>
    <link rel="stylesheet" href="style.css">
    <script src="login.js" defer></script>
</head>

<body class="login-page">
    <header>
        <h1>Svampletarna</h1>
        <nav aria-label="Huvudmeny">
            <ul>
                <li><a href="index.html">Alla svampar</a></li>
                <li><a href="mina-svampar.html">Mina svampar</a></li>
                <li><a href="lookalikes.html">Svampguiden</a></li>
                <li><a href="blogg.html">Blogg</a></li>
                <li><a href="login.html" aria-current="page">Logga in</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Medlemsinloggning</h2>

        <section class="form-card login-box" aria-label="Inloggning">
            <p id="message" aria-live="polite" hidden></p>

            <form id="login-form">
                <label>
                    Namn
                    <input type="text" name="username" autocomplete="username" required>
                </label>

                <label>
                    Lösenord
                    <input type="password" name="password" autocomplete="current-password" required>
                </label>

                <button type="submit">Logga in</button>
            </form>

            <button type="button" id="logout" hidden>Logga ut</button>
        </section>
    </main>

    <footer>
        <p>Svampletarna – WU26</p>
    </footer>
</body>

</html>
